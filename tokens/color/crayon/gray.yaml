color:
  $type: color
  white:
    $description: 'Lightest surface (light scheme) or primary text (dark scheme)'
    $value: '#ffffff'
    $extensions:
      com.redhat.print:
        colorSpace: cmyk
        components: [0, 0, 0, 0]
        pantone: White C
    attributes:
      type: gray

  gray:
    $extensions:
      isCrayon: true
      com.redhat.ux:
        order: 390
        description: >-
          In addition to white and black, each scheme features various shades of gray.
          Be mindful of accessibility when using text or components on top of shades of gray.

    10:
      $value: '#F2F2F2'
      $description: Tertiary surface (light scheme)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 5]
      attributes:
        type: gray
    20:
      $value: '#E0E0E0'
      $description: Secondary surface (light scheme)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 12]
          pantone: 420 C
      attributes:
        type: gray
    30:
      $value: '#C7C7C7'
      $description: Subtle borders (light scheme)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 22]
          pantone: 421 C
      attributes:
        type: gray
    40:
      $value: '#A3A3A3'
      $description: Subtle icon (hover state)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 36]
          pantone: 422 C
      attributes:
        type: gray
    45:
      $value: '#8C8C8C'
      $description: Call to action text decoration (unified theme)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 46]
      attributes:
        type: gray
    50:
      $value: '#707070'
      $description: Subtle icon
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 56]
          pantone: 423 C
      attributes:
        type: gray
    60:
      $value: '#4D4D4D'
      $description: Secondary text (light scheme)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 70]
          pantone: 424 C
      attributes:
        type: gray
    70:
      $value: '#383838'
      $description: Tertiary surface (dark scheme)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 78]
          pantone: 425 C
      attributes:
        type: gray
    80:
      $value: '#292929'
      $description: Alternative tertiary surface (not available for use with context provider)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 84]
      attributes:
        type: gray
    90:
      $value: '#1F1F1F'
      $description: Secondary surface (dark scheme)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 88]
          pantone: 426 C
      attributes:
        type: gray
    95:
      $value: '#151515'
      $description: Primary surface (dark scheme) or primary text (light scheme)
      $extensions:
        com.redhat.print:
          colorSpace: cmyk
          components: [0, 0, 0, 100]
      attributes:
        type: gray

  black:
    $value: '#000000'
    $description: Brand black (avoid using)
    $extensions:
      com.redhat.print:
        colorSpace: cmyk
        components: [60, 40, 40, 100]
        pantone: Black C
    attributes:
      type: gray
